<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herbal Goodness — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f08;
    --bg-2:#12150d;
    --panel:#161a10;
    --panel-2:#1b2013;
    --line:rgba(166,171,12,0.16);
    --line-soft:rgba(238,241,228,0.08);
    --olive:#698805;
    --olive-deep:#4c6404;
    --olive-pale:#c5efc5;
    --gold:#d8c832;
    --gold-deep:#a6ab0c;
    --mint:#9fe6a0;
    --text:#f1f3e8;
    --text-dim:#aab19a;
    --text-faint:#6d7462;
    --danger:#ff6f61;
    --danger-bg:rgba(255,111,97,0.12);
    --warn:#f2c94c;
    --warn-bg:rgba(242,201,76,0.12);
    --good:#7ed992;
    --good-bg:rgba(126,217,146,0.12);
    --radius:14px;
    --display:'Poppins',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(105,136,5,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(216,200,50,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--display);
    font-weight:400;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--gold);}
  .eyebrow{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:2.5px;
    font-size:10.5px;
    font-weight:600;
    color:var(--gold-deep);
  }
