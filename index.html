<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herbal Goodness — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f08;
    --bg-2:#12150d;
    --panel:#161a10;
    --panel-2:#1b2013;
    --line:rgba(166,171,12,0.16);
    --line-soft:rgba(238,241,228,0.08);
    --olive:#698805;
    --olive-deep:#4c6404;
    --olive-pale:#c5efc5;
    --gold:#d8c832;
    --gold-deep:#a6ab0c;
    --mint:#9fe6a0;
    --text:#f1f3e8;
    --text-dim:#aab19a;
    --text-faint:#6d7462;
    --danger:#ff6f61;
    --danger-bg:rgba(255,111,97,0.12);
    --warn:#f2c94c;
    --warn-bg:rgba(242,201,76,0.12);
    --good:#7ed992;
    --good-bg:rgba(126,217,146,0.12);
    --radius:14px;
    --display:'Poppins',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(105,136,5,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(216,200,50,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--display);
    font-weight:400;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--gold);}
  .eyebrow{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:2.5px;
    font-size:10.5px;
    font-weight:600;
    color:var(--gold-deep);
  }
  /* ============ TOPBAR ============ */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:20px;
    padding:14px 28px;
    background:rgba(13,15,8,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(135deg,var(--olive),var(--gold-deep));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:800; color:#0d0f08; font-size:16px;
    box-shadow:0 0 22px rgba(216,200,50,0.35);
    flex-shrink:0;
  }
  .brand-text .eyebrow{margin-bottom:2px;}
  .brand-text h1{margin:0; font-size:16px; font-weight:700; color:var(--text); letter-spacing:0.2px;}
  nav.tabs{display:flex; gap:4px; background:rgba(255,255,255,0.03); padding:5px; border-radius:12px; border:1px solid var(--line-soft);}
  nav.tabs button{
    font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    font-weight:600; color:var(--text-dim); background:transparent; border:none;
    padding:9px 14px; border-radius:8px; cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:linear-gradient(135deg,var(--olive),var(--olive-deep)); color:#fff; box-shadow:0 2px 10px rgba(105,136,5,0.4);}
  .status-chip{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); flex-shrink:0;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  main{max-width:1320px; margin:0 auto; padding:32px 28px 80px;}
  .page{display:none;}
  .page.active{display:block; animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .page-head{margin-bottom:28px; max-width:760px;}
  .page-head h2{font-size:26px; margin:6px 0 8px; font-weight:700; color:#fff;}
  .page-head p{margin:0; color:var(--text-dim); font-size:14.5px;}

  /* ============ CARDS ============ */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:20px;
  }
  .kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:30px;}
  .kpi{
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    position:relative; overflow:hidden;
  }
  .kpi::after{content:''; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--olive),var(--gold));}
  .kpi .eyebrow{display:block; margin-bottom:10px;}
  .kpi .val{font-size:25px; font-weight:700; color:#fff; letter-spacing:-0.3px;}
  .kpi .sub{margin-top:8px; font-size:12px; color:var(--text-dim);}
  .kpi .tag{display:inline-block; margin-top:10px; font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:20px; font-weight:600;}
  .tag.good{background:var(--good-bg); color:var(--good);}
  .tag.warn{background:var(--warn-bg); color:var(--warn);}
  .tag.bad{background:var(--danger-bg); color:var(--danger);}
  .tag.info{background:rgba(255,255,255,0.07); color:var(--text-dim);}
  .flag{display:inline-block; font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .flag.good{background:var(--good-bg); color:var(--good);}
  .flag.warn{background:var(--warn-bg); color:var(--warn);}
  .flag.bad{background:var(--danger-bg); color:var(--danger);}
  .flag.info{background:rgba(255,255,255,0.07); color:var(--text-dim);}
  .highlight-kpi{border-color:rgba(216,200,50,0.4); box-shadow:0 0 0 1px rgba(216,200,50,0.12) inset;}
  .row-highlight{background:rgba(216,200,50,0.07);}

  /* ============ WEEK STRIP ============ */
  .week-strip-wrap{margin-bottom:22px;}
  .week-strip-label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .week-strip{
    display:flex; gap:6px; overflow-x:auto; padding:6px 2px 14px;
    scrollbar-width:thin;
  }
  .week-strip::-webkit-scrollbar{height:6px;}
  .week-strip::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  .wk-btn{
    flex:0 0 auto; width:52px; height:44px; border-radius:9px; border:1px solid var(--line-soft);
    background:rgba(255,255,255,0.03); color:var(--text-dim); font-family:var(--mono); font-size:11px; font-weight:600;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    transition:all .12s ease;
  }
  .wk-btn .n{font-size:12px;}
  .wk-btn .dot2{width:5px; height:5px; border-radius:50%; background:var(--text-faint);}
  .wk-btn.has-actual .dot2{background:var(--good);}
  .wk-btn.future .dot2{background:var(--text-faint);}
  .wk-btn.partial .dot2{background:var(--warn);}
  .wk-btn:hover{border-color:var(--gold-deep); color:var(--text);}
  .wk-btn.active{background:linear-gradient(135deg,var(--olive),var(--olive-deep)); color:#fff; border-color:transparent; box-shadow:0 3px 14px rgba(105,136,5,0.45);}

  .detail-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media (max-width:900px){.detail-grid{grid-template-columns:1fr;}}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1px; font-weight:600;
    color:var(--text-faint); text-align:left; padding:9px 10px; border-bottom:1px solid var(--line);
  }
  td{padding:10px 10px; border-bottom:1px solid var(--line-soft); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right; font-family:var(--mono);}
  .muted{color:var(--text-faint); font-size:11.5px;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-family:var(--mono); font-weight:600;}

  .note-box{
    margin-top:14px; padding:12px 14px; border-radius:10px; background:rgba(242,201,76,0.08);
    border:1px solid rgba(242,201,76,0.25); font-size:12.5px; color:var(--warn); line-height:1.6;
  }
  .note-box.info{background:rgba(255,255,255,0.04); border-color:var(--line-soft); color:var(--text-dim);}

  section.block{margin-top:34px;}
  section.block h3{font-size:16px; margin:0 0 4px; color:#fff;}
  section.block .desc{color:var(--text-dim); font-size:13px; margin:0 0 16px; max-width:720px;}

  /* ============ CS PROGRESS HEADER ============ */
  .progress-header{
    display:flex; align-items:center; gap:18px; background:linear-gradient(135deg, rgba(105,136,5,0.14), rgba(216,200,50,0.06));
    border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:30px;
  }
  .progress-ring{position:relative; width:74px; height:74px; flex-shrink:0;}
  .progress-ring svg{transform:rotate(-90deg);}
  .progress-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:15px; color:#fff;}
  .progress-text h3{margin:0 0 4px;}
  .progress-text p{margin:0; font-size:13px; color:var(--text-dim);}
  .progress-bar-outer{flex:1; height:8px; border-radius:8px; background:rgba(255,255,255,0.06); overflow:hidden; min-width:120px;}
  .progress-bar-inner{height:100%; background:linear-gradient(90deg,var(--olive),var(--gold)); width:0%; transition:width .4s ease; box-shadow:0 0 12px rgba(216,200,50,0.6);}

  /* ============ SPINE (signature element) ============ */
  .spine-wrap{position:relative; padding-left:38px;}
  .spine-line{
    position:absolute; left:13px; top:6px; bottom:6px; width:2px;
    background:linear-gradient(180deg, var(--line-soft), var(--line-soft));
    border-radius:2px;
  }
  .spine-fill{
    position:absolute; left:0; top:0; width:100%; height:0%;
    background:linear-gradient(180deg,var(--olive),var(--gold));
    box-shadow:0 0 14px 2px rgba(216,200,50,0.55);
    transition:height .5s ease; border-radius:2px;
  }
  .todo-item{
    position:relative; display:flex; align-items:flex-start; gap:14px;
    padding:14px 16px 14px 6px; margin-bottom:10px; border-radius:12px;
    background:rgba(255,255,255,0.025); border:1px solid var(--line-soft);
    cursor:pointer; transition:background .15s ease;
  }
  .todo-item:hover{background:rgba(255,255,255,0.05);}
  .todo-item.done{opacity:0.55;}
  .todo-node{
    position:absolute; left:-38px; top:16px; width:26px; height:26px; border-radius:50%;
    background:var(--bg-2); border:2px solid var(--line); z-index:2;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-faint);
    transition:all .3s ease;
  }
  .todo-item.done .todo-node{background:var(--gold); border-color:var(--gold); color:#0d0f08; box-shadow:0 0 14px rgba(216,200,50,0.7);}
  .todo-check{
    flex-shrink:0; width:20px; height:20px; border-radius:5px; border:2px solid var(--text-faint);
    display:flex; align-items:center; justify-content:center; margin-top:2px; transition:all .15s ease;
  }
  .todo-item.done .todo-check{background:var(--olive); border-color:var(--olive);}
  .todo-check svg{opacity:0; width:12px; height:12px;}
  .todo-item.done .todo-check svg{opacity:1;}
  .todo-body strong{display:block; font-size:13.8px; color:var(--text); margin-bottom:3px; text-decoration:none;}
  .todo-item.done .todo-body strong{text-decoration:line-through; color:var(--text-dim);}
  .todo-body span{font-size:12px; color:var(--text-dim);}
  .todo-meta{margin-left:auto; text-align:right; flex-shrink:0;}
  .todo-meta .pill{margin-bottom:4px;}

  /* ============ CS METRIC TABLE ============ */
  .cs-metric-table td.metric-name{font-weight:600; color:var(--text);}
  .cs-metric-table td.metric-name span{display:block; font-weight:400; font-size:11px; color:var(--text-faint); margin-top:2px;}

  /* ============ PRIORITY LADDER ============ */
  .ladder{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:30px;}
  @media (max-width:900px){.ladder{grid-template-columns:1fr;}}
  .ladder-col{border-radius:var(--radius); border:1px solid var(--line-soft); overflow:hidden;}
  .ladder-head{padding:14px 16px; font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:1px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
  .ladder-head.red{background:var(--danger-bg); color:var(--danger);}
  .ladder-head.yellow{background:var(--warn-bg); color:var(--warn);}
  .ladder-head.green{background:var(--good-bg); color:var(--good);}
  .ladder-body{padding:6px; max-height:420px; overflow-y:auto;}
  .ladder-item{padding:10px 10px; border-radius:8px; font-size:12.5px;}
  .ladder-item:hover{background:rgba(255,255,255,0.04);}
  .ladder-item b{display:block; color:var(--text); font-size:13px; margin-bottom:2px;}
  .ladder-item .meta{color:var(--text-faint); font-size:11px;}

  /* ============ SORTABLE TABLE ============ */
  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line-soft);}
  #skuTable th{cursor:pointer; user-select:none; white-space:nowrap;}
  #skuTable th:hover{color:var(--text);}
  #skuTable th .arrow{margin-left:4px; opacity:0.5;}
  #skuTable tbody tr:hover{background:rgba(255,255,255,0.03);}
  .stock-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px;}
  .stock-dot.ok{background:var(--good);}
  .stock-dot.warn{background:var(--warn);}
  .stock-dot.critical{background:var(--danger);}

  /* ============ MARKETING CHARTS ============ */
  .chart-card{padding:20px 20px 12px;}
  .chart-card .chart-title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
  .chart-card h4{margin:0; font-size:14px; color:#fff;}
  .chart-card .chart-title .muted{font-size:11px;}
  svg.chart{width:100%; height:150px; overflow:visible;}
  .bench-table td.status-hit{color:var(--good); font-weight:600;}
  .bench-table td.status-miss{color:var(--danger); font-weight:600;}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}
  .three-col{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:900px){.three-col{grid-template-columns:1fr;}}

  /* ============ MINI STAT TILES (Unit Economics) ============ */
  .mini-stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:900px){.mini-stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.mini-stat-grid{grid-template-columns:1fr;}}
  .mini-stat{background:rgba(255,255,255,0.025); border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px;}
  .mini-stat .mini-eyebrow{display:block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:6px;}
  .mini-stat .mini-val{font-size:16.5px; font-weight:700; color:#fff; margin-bottom:2px; line-height:1.3;}
  .mini-stat .mini-val2{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .mini-stat .mini-note{font-size:10.5px; color:var(--text-faint); line-height:1.5;}
  .platform-table td, .platform-table th{white-space:nowrap;}
  .platform-table td .muted{cursor:help; border-bottom:1px dotted var(--line);}

  /* ============ MARKETPLACE HEALTH ============ */
  .health-score-badge{
    display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:var(--radius);
    border:1px solid var(--line-soft); background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  }
  .health-score-ring{
    width:64px; height:64px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:19px; color:#fff;
    border:5px solid var(--line-soft);
  }
  .health-score-ring.red{border-color:var(--danger); color:var(--danger); box-shadow:0 0 16px rgba(255,111,97,0.35);}
  .health-score-ring.yellow{border-color:var(--warn); color:var(--warn);}
  .health-score-ring.green{border-color:var(--good); color:var(--good);}
  .health-score-badge h4{margin:0 0 3px; font-size:15px; color:#fff;}
  .health-score-badge p{margin:0; font-size:12.5px; color:var(--text-dim);}
  .alert-banner{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; margin-top:12px;
    background:var(--danger-bg); border:1px solid rgba(255,111,97,0.3); font-size:12.5px; color:var(--text);
  }
  .alert-banner .ico{flex-shrink:0; font-size:15px;}
  .alert-banner b{color:var(--danger);}
  .health-metric{margin-bottom:18px;}
  .health-metric:last-child{margin-bottom:0;}
  .health-metric-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .health-metric-head span:first-child{font-size:13px; font-weight:600; color:var(--text);}
  .health-bar-outer{position:relative; height:9px; border-radius:6px; background:rgba(255,255,255,0.06); overflow:visible;}
  .health-bar-inner{height:100%; border-radius:6px; transition:width .5s ease;}
  .health-bar-inner.good{background:linear-gradient(90deg,var(--olive),var(--good));}
  .health-bar-inner.warn{background:linear-gradient(90deg,var(--gold-deep),var(--warn));}
  .health-bar-inner.critical{background:linear-gradient(90deg,#b3261e,var(--danger));}
  .health-threshold-mark{position:absolute; top:-3px; width:2px; height:15px; background:rgba(255,255,255,0.55);}
  .health-metric-sub{margin-top:6px; font-size:11px; color:var(--text-faint); font-family:var(--mono);}
  .channel-kpi{position:relative;}
  .channel-kpi .trend{font-family:var(--mono); font-size:12.5px; font-weight:700;}
  .channel-kpi .trend.up{color:var(--good);}
  .channel-kpi .trend.down{color:var(--danger);}
  .walmart-status-card{display:flex; flex-direction:column; gap:10px;}
  .walmart-status-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .walmart-status-row:last-child{border-bottom:none;}
  .walmart-status-row .k{color:var(--text-dim);}
  .walmart-status-row .v{color:var(--text); font-weight:600; font-family:var(--mono); font-size:12.5px;}

  /* ============ EMAIL ANALYTICS ============ */
  .anomaly-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:8px;}
  @media (max-width:900px){.anomaly-grid{grid-template-columns:1fr;}}
  .anomaly-card{background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px 18px;}
  .anomaly-card .ac-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .anomaly-card .ac-head h4{margin:0; font-size:13.5px; color:#fff; font-weight:600;}
  .anomaly-card .ac-head .tag{flex-shrink:0; margin-top:0;}
  .anomaly-card .ac-row{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--text-dim); padding:6px 0; border-bottom:1px solid var(--line-soft);}
  .anomaly-card .ac-row:last-of-type{border-bottom:none;}
  .anomaly-card .ac-row b{color:var(--text); font-family:var(--mono); font-weight:600;}
  .anomaly-card .ac-row .delta{font-family:var(--mono); font-weight:700; margin-left:6px;}
  .anomaly-card .ac-row .delta.up{color:var(--good);}
  .anomaly-card .ac-row .delta.down{color:var(--danger);}
  .anomaly-card .ac-note{margin-top:10px; font-size:11.5px; color:var(--text-faint); line-height:1.5;}

  .idea-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media (max-width:900px){.idea-grid{grid-template-columns:1fr;}}
  .idea-card{background:rgba(255,255,255,0.025); border:1px solid var(--line-soft); border-radius:12px; padding:14px 16px; display:flex; gap:12px;}
